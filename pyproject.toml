[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenforge"
version = "0.1.0"
description = "Inspectable byte-level BPE and WordPiece tokenizers"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
benchmark = ["tokenizers==0.23.3", "tiktoken==0.14.0", "pyarrow==26.0.1", "numpy==2.3.5"]

[project.scripts]
tokenforge = "tokenforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/tokenforge"]
